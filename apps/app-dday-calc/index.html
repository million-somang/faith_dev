    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Open Graph & 소셜 바이럴 메타 태그 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FaithPortal" />
    <meta property="og:title" content="2026 감성 D-Day & 기념일 계산기" />
    <meta property="og:description" content="설레는 목표와 소중한 기념일을 원클릭으로 계산하고 관리하는 프리미엄 D-Day 관리 도구." />
    <meta property="og:image" content="/images/og-dday-calc.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="2026 감성 D-Day & 기념일 계산기" />

    <!-- 구조화된 데이터 (Schema.org JSON-LD for SERP & GEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "감성 D-Day & 기념일 계산기",
          "applicationCategory": "UtilityApplication",
          "operatingSystem": "All",
          "browserRequirements": "Requires JavaScript. Requires HTML5.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "KRW"
          },
          "description": "2026년 공인 기준 디데이 카운트다운(Countdown), 기념일 카운트업(Countup) 및 목표 일정 정밀 산정기"
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "D-Day 카운트다운에서 당일과 전날 표기는 어떻게 되나요?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "목표일 당일은 D-Day로 표시되며, 목표일 하루 전은 D-1, 지난 날은 D+N으로 정확히 표기됩니다."
              }
            },
            {
              "@type": "Question",
              "name": "커플 기념일 계산 시 당일을 1일로 포함하나요?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "기념일 모드에서 '기준일을 1일로 포함' 옵션을 체크하시면 시작 당일이 1일째로 정확히 가산되어 산출됩니다."
              }
            }
          ]
        }
      ]
    }
    </script>
